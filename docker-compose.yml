services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: memlayer-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: memlayer-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: memlayer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: memlayer-langfuse
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/memlayer
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=memlayer-langfuse-nextauth-secret-key-32chars
      - SALT=memlayer-langfuse-salt-key-string
      - TELEMETRY_ENABLED=false
    restart: unless-stopped

volumes:
  qdrant_storage:
  pgdata:
