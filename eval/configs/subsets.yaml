# Benchmark Subsets and Split Configurations

benchmarks:
  longmemeval:
    name: "LongMemEval"
    description: "Multi-session long-term memory benchmark assessing update, temporal, multi-session and abstention."
    fixture_path: "eval/datasets/fixtures/longmemeval_sample.json"
    categories:
      - knowledge_update
      - temporal_reasoning
      - multi_session
      - abstention
    splits:
      dev:
        limit: 20
        default_seed: 42
      test:
        limit: 100
        default_seed: 1337

  locomo:
    name: "LoCoMo"
    description: "Long-context conversational memory benchmark evaluating session coherence and cross-session synthesis."
    fixture_path: "eval/datasets/fixtures/locomo_sample.json"
    categories:
      - knowledge_update
      - temporal_reasoning
      - multi_session
      - abstention
    splits:
      dev:
        limit: 20
        default_seed: 42
      test:
        limit: 100
        default_seed: 1337

baselines:
  full_context:
    enabled: true
    description: "Verbatim concatenation of entire conversational history into prompt context."
  naive_rag:
    enabled: true
    top_k: 3
    chunk_size: 512
    description: "Chunked vector similarity retrieval without decay, BM25, or conflict supersession."
  memlayer:
    enabled: true
    token_budget: 1500
    description: "Agent Memory Layer with atomic extraction, supersession, BM25 hybrid search, and decay."

models:
  answer_model: "gemini/gemini-1.5-flash"
  judge_model: "gemini/gemini-1.5-pro"
  temperature: 0.0
  max_tokens: 512

cache:
  enabled: true
  cache_dir: "eval/cache"
