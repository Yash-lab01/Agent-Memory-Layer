[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-layer"
version = "0.1.0"
description = "Durable long-term memory layer for conversational agents, benchmarked on LongMemEval and LoCoMo."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Yash Bhawar", email = "yashpbhawar2003@gmail.com" }
]
keywords = [
    "memory",
    "llm",
    "agents",
    "conversational-ai",
    "rag",
    "evaluation",
    "mcp"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "litellm>=1.40.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "qdrant-client>=1.9.0",
    "apscheduler>=3.10.4",
    "alembic>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/Yash-lab01/Agent-Memory-Layer"
Repository = "https://github.com/Yash-lab01/Agent-Memory-Layer"
Issues = "https://github.com/Yash-lab01/Agent-Memory-Layer/issues"

[project.scripts]
memlayer-mcp = "memlayer.mcp_server:main"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
]
demo = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
]
mcp = [
    "mcp>=1.0.0",
]
tracing = [
    "langfuse>=2.36.0",
]
eval = [
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
]
all = [
    "agent-memory-layer[postgres,demo,mcp,tracing,eval]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memlayer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/memlayer",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["memlayer"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
